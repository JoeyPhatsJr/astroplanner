<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#02030a" />
    <script>
      // Apply night vision before first paint so the screen never flashes bright at the telescope.
      try {
        var p = JSON.parse(localStorage.getItem("astroplanner.prefs.v1") || "{}");
        document.documentElement.dataset.vision = p.nightVision ? "night" : "normal";
      } catch (e) {
        document.documentElement.dataset.vision = "normal";
      }
    </script>
    <meta name="description" content="AstroPlanner: plan astrophotography nights with real forecasts and computed target visibility." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AstroPlanner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
