name: Keep hosted site awake

# Render's free web service sleeps after 15 idle minutes and takes up to a minute to wake, and Supabase pauses a
# free project after a week without activity. Every 10 minutes this asks the live API for /api/health, which
# keeps Render awake (one always-on service fits in the free 750 instance hours a month) and runs one database
# query. GitHub may start scheduled runs a few minutes late. Set the repository variable SITE_URL
# (Settings > Secrets and variables > Actions > Variables) to the live site; with it unset this does nothing.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL is not set; skipping."; exit 0; fi
          # If Render did fall asleep, the first request can take about a minute.
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 "$SITE_URL/api/health"
