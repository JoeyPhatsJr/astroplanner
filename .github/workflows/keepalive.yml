name: Keep hosted site awake

# Supabase pauses a free project after a week without activity. Every few days this asks the live API for
# /api/health, which runs one database query. Set the repository variable SITE_URL (Settings > Secrets and
# variables > Actions > Variables), e.g. https://astroplanner.vercel.app; with it unset this does nothing.
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL is not set; skipping."; exit 0; fi
          # Render's free service may be asleep; the first request can take about a minute.
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 120 "$SITE_URL/api/health"
